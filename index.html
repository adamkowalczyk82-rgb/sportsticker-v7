<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONKEY BAR Sports Ticker</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --primary-glow: #00f0ff;
            --secondary-glow: #ff0055;
            --accent-gold: #ffcc00;
            --bg-dark: #030508;
            --card-bg: rgba(10, 16, 26, 0.88);
            --team-primary: #00f0ff;
            --team-secondary: #ff0055;
            --stadium-glow: rgba(0, 240, 255, 0.18);
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Roboto Condensed', sans-serif;
            cursor: none;
        }

        /* CANVAS CYBER BACKGROUND */
        #cyberCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.45;
        }

        /* PERFECTLY CENTERED 90-DEGREE ROTATION FOR PORTRAIT MOUNTED 16:9 TV */
        body.rotated-90 {
            width: 100vh !important;
            height: 100vw !important;
            transform: rotate(90deg);
            transform-origin: center center;
            position: absolute;
            top: calc(50% - 50vw);
            left: calc(50% - 50vh);
        }

        .tv-frame {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 25%, var(--stadium-glow) 0%, rgba(3, 5, 8, 0.98) 75%);
            position: relative;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
            transition: background 1.2s ease-in-out;
            z-index: 2;
        }

        .stadium-flare {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130%;
            height: 40vh;
            background: radial-gradient(ellipse at top, var(--team-primary) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.3;
            pointer-events: none;
            transition: all 1.2s ease-in-out;
            z-index: 2;
        }

        header {
            z-index: 10;
            padding: 2vh 2vw 1vh;
            background: linear-gradient(180deg, rgba(3,5,8,0.98) 0%, rgba(3,5,8,0.6) 80%, transparent 100%);
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5vh;
        }

        .sync-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(0.75rem, 1.2vh, 1.1rem);
            color: #00f0ff;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            background: rgba(0, 240, 255, 0.08);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .sync-spinner {
            width: 10px;
            height: 10px;
            border: 2px solid var(--accent-gold);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rotate-btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: clamp(28px, 4vh, 38px);
            height: clamp(28px, 4vh, 38px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .rotate-btn-icon:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--primary-glow);
            transform: scale(1.08);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .rotate-btn-icon svg {
            width: 60%;
            height: 60%;
            fill: #ffffff;
        }

        .bar-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(2.8rem, 5.5vh, 4.8rem);
            line-height: 0.85;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 20%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            text-align: center;
        }

        .live-clock {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1rem, 2vh, 1.6rem);
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }

        .sport-badge-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 0.8vh;
        }

        .league-badge {
            background: var(--team-primary);
            color: #030508;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.8vh, 1.4rem);
            padding: 4px 20px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px var(--team-primary);
            transition: all 0.8s ease;
        }

        .rotator-timer-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 0;
            left: 0;
            overflow: hidden;
        }

        .rotator-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--team-primary), var(--team-secondary));
            box-shadow: 0 0 12px var(--team-primary);
            transition: width 0.1s linear;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5vh 2vw;
            gap: 1.5vh;
            z-index: 5;
        }

        .matchup-card, .spotlight-card {
            background: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 2vh 2vw;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 40px var(--stadium-glow);
            backdrop-filter: blur(14px);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out, border-color 0.8s ease, box-shadow 0.8s ease;
            opacity: 1;
            transform: scale(1);
        }

        .matchup-card::before, .spotlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--team-primary), transparent);
        }

        .matchup-card.fade-out, .spotlight-card.fade-out {
            opacity: 0;
            transform: scale(0.97);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2vh;
            padding-bottom: 0.8vh;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .game-status {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 1.6vh, 1.3rem);
            padding: 4px 14px;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .status-live {
            background: #ff0044;
            color: #fff;
            animation: pulse-red 1.5s infinite;
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
        }

        .status-pregame {
            background: rgba(0, 240, 255, 0.2);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .status-final {
            background: rgba(255, 255, 255, 0.15);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0.8); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0); }
        }

        .network-info {
            font-size: clamp(0.85rem, 1.5vh, 1.2rem);
            color: #00f0ff;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* LIVE WIN PROBABILITY / MOMENTUM BAR */
        .momentum-bar-container {
            margin-bottom: 1.2vh;
        }

        .momentum-labels {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.65rem, 1.1vh, 0.85rem);
            color: #a0aab5;
            font-family: 'Oswald', sans-serif;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .momentum-track {
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }

        .momentum-away {
            height: 100%;
            background: var(--team-primary);
            box-shadow: 0 0 10px var(--team-primary);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .momentum-home {
            height: 100%;
            background: var(--team-secondary);
            box-shadow: 0 0 10px var(--team-secondary);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .teams-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1vw;
            margin-bottom: 1.5vh;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-wrapper {
            width: clamp(75px, 12vh, 130px);
            height: clamp(75px, 12vh, 130px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5vh;
            filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.4));
        }

        .team-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .team-name {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.9rem, 3.4vh, 3.2rem);
            font-weight: 700;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .team-record {
            font-size: clamp(0.75rem, 1.3vh, 1rem);
            color: #8a9ba8;
            margin-top: 2px;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
        }

        .score-display {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.8rem, 5.5vh, 4.5rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            margin-top: 4px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }

        .vs-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .vs-text {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.8rem, 3vh, 2.8rem);
            color: var(--accent-gold);
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .game-time {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 1.6vh, 1.2rem);
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
        }

        .odds-bar {
            background: rgba(3, 5, 8, 0.8);
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 12px;
            padding: 1.2vh 1vw;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.15);
        }

        .odds-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .odds-label {
            font-size: clamp(0.65rem, 1.1vh, 0.9rem);
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .odds-value {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1rem, 1.9vh, 1.6rem);
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
        }

        .spotlight-card {
            padding: 1.5vh 2vw;
            gap: 1vh;
            border-width: 1px;
        }

        .spotlight-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 1.6vh, 1.2rem);
            color: var(--team-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.6vh;
            text-shadow: 0 0 10px var(--team-primary);
        }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1vw;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            background: rgba(3, 5, 8, 0.6);
            padding: 1.2vh 1vw;
            border-radius: 12px;
            border-left: 4px solid var(--team-primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .player-card.away {
            border-left-color: var(--team-primary);
        }

        .player-card.home {
            border-left-color: var(--team-secondary);
        }

        /* CLEAN PLAYER HEADSHOT - CYBERPUNK FILTER REMOVED */
        .player-headshot {
            width: clamp(45px, 6.5vh, 65px);
            height: clamp(45px, 6.5vh, 65px);
            border-radius: 50%;
            object-fit: cover;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            box-shadow: none;
            filter: none;
        }

        .player-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .player-name {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.95rem, 1.9vh, 1.4rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        .player-pos {
            font-size: clamp(0.65rem, 1.2vh, 0.9rem);
            color: #8a9ba8;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .player-stat-line {
            font-size: clamp(0.8rem, 1.5vh, 1.2rem);
            color: var(--accent-gold);
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        footer {
            height: clamp(52px, 7.5vh, 75px);
            background: #010306;
            border-top: 3px solid var(--team-primary);
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 10;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.95), 0 0 20px var(--team-primary);
            transition: border-color 0.8s ease, box-shadow 0.8s ease;
        }

        .ticker-label-badge {
            background: var(--team-primary);
            color: #030508;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(0.95rem, 1.9vh, 1.5rem);
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            white-space: nowrap;
            letter-spacing: 2px;
            box-shadow: 8px 0 20px rgba(0,0,0,0.8);
            transition: background 0.8s ease;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            animation: scrollTicker 38s linear infinite;
        }

        @keyframes scrollTicker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 0 35px;
            font-size: clamp(0.95rem, 1.9vh, 1.4rem);
            font-weight: 500;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }

        .ticker-item span.highlight {
            color: var(--accent-gold);
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .ticker-item span.divider {
            color: var(--team-primary);
            margin-left: 15px;
            text-shadow: 0 0 10px var(--team-primary);
        }
    </style>
</head>
<body id="bodyEl" class="rotated-90">

    <canvas id="cyberCanvas"></canvas>

    <div class="tv-frame" id="tvFrame">
        <div class="stadium-flare" id="stadiumFlare"></div>

        <header>
            <div class="header-top-row">
                <div class="sync-badge">
                    <div class="sync-spinner"></div>
                    <span id="syncText">LIVE API ACTIVE</span>
                </div>

                <div class="header-right-controls">
                    <div class="live-clock" id="liveClock">12:00 PM</div>
                    <button class="rotate-btn-icon" onclick="toggleRotation(event)" title="Rotate Screen 90°">
                        <svg viewBox="0 0 24 24">
                            <path d="M7.11 8.53L5.7 7.11C4.8 8.07 4.24 9.32 4.09 10.72h2c.13-1 .54-1.9 1.02-2.19zM6.09 13.28h-2c.15 1.4 0.71 2.65 1.61 3.61l1.41-1.41c-.48-.29-.89-1.2-1.02-2.2zm10.8 5.19l1.41 1.41c.9-.96 1.46-2.21 1.61-3.61h-2c-.13 1-.54 1.91-1.02 2.2zM17.91 10.72h2c-.15-1.4-.71-2.65-1.61-3.61l-1.41 1.41c.48.29.89 1.2 1.02 2.2zM12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="bar-title" id="barTitle">MONKEY BAR</div>

            <div class="sport-badge-container">
                <div class="league-badge" id="leagueBadge">LOADING LIVE SCORES...</div>
            </div>

            <div class="rotator-timer-bar">
                <div class="rotator-progress" id="rotatorProgress"></div>
            </div>
        </header>

        <main>
            <div class="matchup-card" id="matchupCard">
                <div class="status-header">
                    <div class="game-status status-pregame" id="gameStatus">FETCHING</div>
                    <div class="network-info" id="networkInfo">ESPN LIVE FEED</div>
                </div>

                <!-- Live Win Probability / Momentum Bar -->
                <div class="momentum-bar-container" id="momentumContainer">
                    <div class="momentum-labels">
                        <span id="awayWinProb">AWAY 50%</span>
                        <span>WIN PROBABILITY</span>
                        <span id="homeWinProb">HOME 50%</span>
                    </div>
                    <div class="momentum-track">
                        <div class="momentum-away" id="momentumAway" style="width: 50%;"></div>
                        <div class="momentum-home" id="momentumHome" style="width: 50%;"></div>
                    </div>
                </div>

                <div class="teams-container" id="teamsContainer">
                    <div class="team-box">
                        <div class="logo-wrapper" id="logoWrapAway">
                            <img src="" class="team-logo" id="awayLogo" alt="Away">
                        </div>
                        <div class="team-name" id="awayName">AWAY</div>
                        <div class="team-record" id="awayRecord">-</div>
                        <div class="score-display" id="awayScore">0</div>
                    </div>

                    <div class="vs-divider">
                        <div class="vs-text">VS</div>
                        <div class="game-time" id="gameTimeCenter">--</div>
                    </div>

                    <div class="team-box">
                        <div class="logo-wrapper" id="logoWrapHome">
                            <img src="" class="team-logo" id="homeLogo" alt="Home">
                        </div>
                        <div class="team-name" id="homeName">HOME</div>
                        <div class="team-record" id="homeRecord">-</div>
                        <div class="score-display" id="homeScore">0</div>
                    </div>
                </div>

                <div class="odds-bar" id="oddsBar">
                    <div class="odds-item">
                        <span class="odds-label">SPREAD</span>
                        <span class="odds-value" id="oddsSpread">--</span>
                    </div>
                    <div class="odds-item">
                        <span class="odds-label">OVER / UNDER</span>
                        <span class="odds-value" id="oddsTotal">--</span>
                    </div>
                    <div class="odds-item">
                        <span class="odds-label">MONEYLINE</span>
                        <span class="odds-value" id="oddsML">--</span>
                    </div>
                </div>
            </div>

            <div class="spotlight-card" id="spotlightCard">
                <div class="spotlight-title" id="spotlightTitle">
                    <span id="spotlightHeaderText">KEY PLAYER MATCHUP</span>
                    <span style="font-size: clamp(0.65rem, 1.2vh, 0.9rem); color: #8a9ba8;">LIVE STATS</span>
                </div>

                <div class="players-grid" id="playersGrid">
                    <div class="player-card away">
                        <img src="" class="player-headshot" id="awayPlayerImg" alt="Away Player">
                        <div class="player-details">
                            <div class="player-name" id="awayPlayerName">Away Leader</div>
                            <div class="player-pos" id="awayPlayerPos">STARTER</div>
                            <div class="player-stat-line" id="awayPlayerStat">--</div>
                        </div>
                    </div>

                    <div class="player-card home">
                        <img src="" class="player-headshot" id="homePlayerImg" alt="Home Player">
                        <div class="player-details">
                            <div class="player-name" id="homePlayerName">Home Leader</div>
                            <div class="player-pos" id="homePlayerPos">STARTER</div>
                            <div class="player-stat-line" id="homePlayerStat">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="ticker-label-badge" id="tickerBadge">LIVE FEED</div>
            <div class="ticker-wrap">
                <div class="ticker-move" id="tickerContent"></div>
            </div>
        </footer>
    </div>

    <script>
        // CYBERPUNK BACKGROUND PARTICLE/GRID ANIMATION
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                radius: Math.random() * 1.5 + 0.5
            });
        }

        function drawCyberGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
            ctx.lineWidth = 1;

            const gridSize = 60;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0, 240, 255, 0.6)';
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(drawCyberGrid);
        }
        drawCyberGrid();

        // LIVE ESPN API INTEGRATION
        const ROTATE_INTERVAL_MS = 12000;
        let liveMatchups = [];
        let currentMatchupIndex = 0;
        let tickerNews = [];

        const endpoints = [
            { sport: "football", league: "nfl", label: "NFL FOOTBALL", color: "#00f0ff" },
            { sport: "basketball", league: "nba", label: "NBA BASKETBALL", color: "#ff9900" },
            { sport: "hockey", league: "nhl", label: "NHL HOCKEY", color: "#0055ff" },
            { sport: "baseball", league: "mlb", label: "MLB BASEBALL", color: "#ff0055" }
        ];

        async function fetchLiveScores() {
            let fetchedGames = [];
            let tickerItemsList = [];

            for (const ep of endpoints) {
                try {
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ep.sport}/${ep.league}/scoreboard`);
                    const data = await res.json();

                    if (data && data.events) {
                        data.events.forEach(ev => {
                            const comp = ev.competitions[0];
                            const statusType = ev.status.type.state;
                            const statusDesc = ev.status.type.detail;
                            const isLive = statusType === 'in';
                            const isFinal = statusType === 'post';

                            const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
                            const homeTeam = comp.competitors.find(c => c.homeAway === 'home');

                            if (awayTeam && homeTeam) {
                                let statusClass = 'status-pregame';
                                if (isLive) statusClass = 'status-live';
                                if (isFinal) statusClass = 'status-final';

                                let spread = comp.odds && comp.odds[0] && comp.odds[0].details ? comp.odds[0].details : 'ODDS UNAVAILABLE';
                                let overUnder = comp.odds && comp.odds[0] && comp.odds[0].overUnder ? `O/U ${comp.odds[0].overUnder}` : 'O/U --';
                                let ml = 'LIVE';

                                fetchedGames.push({
                                    league: ep.label,
                                    primaryColor: ep.color,
                                    secondaryColor: "#ffffff",
                                    status: statusDesc.toUpperCase(),
                                    statusClass: statusClass,
                                    network: (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names[0]) ? comp.broadcasts[0].names[0] : 'ESPN LIVE',
                                    away: {
                                        name: awayTeam.team.abbreviation,
                                        record: (awayTeam.records && awayTeam.records[0]) ? awayTeam.records[0].summary : '',
                                        score: awayTeam.score || '0',
                                        logo: awayTeam.team.logo
                                    },
                                    home: {
                                        name: homeTeam.team.abbreviation,
                                        record: (homeTeam.records && homeTeam.records[0]) ? homeTeam.records[0].summary : '',
                                        score: homeTeam.score || '0',
                                        logo: homeTeam.team.logo
                                    },
                                    timeCenter: isLive ? statusDesc : (isFinal ? 'FINAL' : new Date(ev.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})),
                                    winProb: { away: 50, home: 50 },
                                    odds: { spread: spread, total: overUnder, ml: ml },
                                    players: {
                                        away: { name: awayTeam.team.name, pos: 'TEAM', stat: `Score: ${awayTeam.score || 0}`, img: awayTeam.team.logo },
                                        home: { name: homeTeam.team.name, pos: 'TEAM', stat: `Score: ${homeTeam.score || 0}`, img: homeTeam.team.logo }
                                    }
                                });

                                tickerItemsList.push(`🔥 <span class='highlight'>${ep.label}</span>: ${awayTeam.team.displayName} (${awayTeam.score || 0}) vs ${homeTeam.team.displayName} (${homeTeam.score || 0}) [${statusDesc}]`);
                            }
                        });
                    }
                } catch (err) {
                    console.error(`Error fetching ${ep.league}:`, err);
                }
            }

            if (fetchedGames.length > 0) {
                liveMatchups = fetchedGames;
                document.getElementById('syncText').textContent = "LIVE API SYNCED";
            } else {
                liveMatchups = [{
                    league: "MONKEY BAR LEAGUE",
                    primaryColor: "#00f0ff",
                    secondaryColor: "#ff0055",
                    status: "NO LIVE GAMES CURRENTLY",
                    statusClass: "status-pregame",
                    network: "MONKEY BAR NETWORK",
                    away: { name: "AWAY", record: "0-0", score: "0", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/gb.png" },
                    home: { name: "HOME", record: "0-0", score: "0", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/det.png" },
                    timeCenter: "STANDBY",
                    winProb: { away: 50, home: 50 },
                    odds: { spread: "EVEN", total: "O/U --", ml: "EVEN" },
                    players: {
                        away: { name: "A. Player", pos: "STAR", stat: "Active", img: "https://a.espncdn.com/i/headshots/nfl/players/full/4241479.png" },
                        home: { name: "H. Player", pos: "STAR", stat: "Active", img: "https://a.espncdn.com/i/headshots/nfl/players/full/3046779.png" }
                    }
                }];
                tickerItemsList = ["💡 <span class='highlight'>MONKEY BAR</span>: Waiting for next live game slate across sports networks..."];
            }

            tickerNews = tickerItemsList;
            initTicker();
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('liveClock').textContent = `${hours}:${minutes} ${ampm}`;
        }

        function toggleRotation(e) {
            e.stopPropagation();
            document.getElementById('bodyEl').classList.toggle('rotated-90');
        }

        function initTicker() {
            const container = document.getElementById('tickerContent');
            let html = '';
            for (let i = 0; i < 2; i++) {
                tickerNews.forEach(item => {
                    html += `<div class="ticker-item">${item}<span class="divider">///</span></div>`;
                });
            }
            container.innerHTML = html;
        }

        function renderMatchup(index) {
            if (!liveMatchups || liveMatchups.length === 0) return;
            const data = liveMatchups[index % liveMatchups.length];
            const card = document.getElementById('matchupCard');
            const spotlight = document.getElementById('spotlightCard');

            card.classList.add('fade-out');
            spotlight.classList.add('fade-out');

            setTimeout(() => {
                const root = document.documentElement;
                root.style.setProperty('--team-primary', data.primaryColor);
                root.style.setProperty('--team-secondary', data.secondaryColor);
                root.style.setProperty('--stadium-glow', `${data.primaryColor}33`);

                const leagueBadge = document.getElementById('leagueBadge');
                leagueBadge.textContent = data.league;
                leagueBadge.style.background = data.primaryColor;
                
                const tickerBadge = document.getElementById('tickerBadge');
                tickerBadge.style.background = data.primaryColor;

                const gameStatus = document.getElementById('gameStatus');
                gameStatus.textContent = data.status;
                gameStatus.className = `game-status ${data.statusClass}`;

                document.getElementById('networkInfo').textContent = data.network;

                // Win Prob
                document.getElementById('awayWinProb').textContent = `${data.away.name} ${data.winProb.away}%`;
                document.getElementById('homeWinProb').textContent = `${data.home.name} ${data.winProb.home}%`;
                document.getElementById('momentumAway').style.width = `${data.winProb.away}%`;
                document.getElementById('momentumHome').style.width = `${data.winProb.home}%`;

                // Teams
                document.getElementById('awayLogo').src = data.away.logo;
                document.getElementById('awayName').textContent = data.away.name;
                document.getElementById('awayRecord').textContent = data.away.record;
                document.getElementById('awayScore').textContent = data.away.score;

                document.getElementById('homeLogo').src = data.home.logo;
                document.getElementById('homeName').textContent = data.home.name;
                document.getElementById('homeRecord').textContent = data.home.record;
                document.getElementById('homeScore').textContent = data.home.score;

                document.getElementById('gameTimeCenter').textContent = data.timeCenter;

                // Odds
                document.getElementById('oddsSpread').textContent = data.odds.spread;
                document.getElementById('oddsTotal').textContent = data.odds.total;
                document.getElementById('oddsML').textContent = data.odds.ml;

                // Players
                document.getElementById('awayPlayerImg').src = data.players.away.img;
                document.getElementById('awayPlayerName').textContent = data.players.away.name;
                document.getElementById('awayPlayerPos').textContent = data.players.away.pos;
                document.getElementById('awayPlayerStat').textContent = data.players.away.stat;

                document.getElementById('homePlayerImg').src = data.players.home.img;
                document.getElementById('homePlayerName').textContent = data.players.home.name;
                document.getElementById('homePlayerPos').textContent = data.players.home.pos;
                document.getElementById('homePlayerStat').textContent = data.players.home.stat;

                card.classList.remove('fade-out');
                spotlight.classList.remove('fade-out');
            }, 400);
        }

        function startRotator() {
            const progressBar = document.getElementById('rotatorProgress');
            let elapsed = 0;
            const intervalStep = 50;

            setInterval(() => {
                if (liveMatchups.length === 0) return;
                elapsed += intervalStep;
                const pct = (elapsed / ROTATE_INTERVAL_MS) * 100;
                progressBar.style.width = `${pct}%`;

                if (elapsed >= ROTATE_INTERVAL_MS) {
                    elapsed = 0;
                    currentMatchupIndex = (currentMatchupIndex + 1) % liveMatchups.length;
                    renderMatchup(currentMatchupIndex);
                }
            }, intervalStep);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            updateClock();
            setInterval(updateClock, 1000);
            await fetchLiveScores();
            setInterval(fetchLiveScores, 60000);
            renderMatchup(0);
            startRotator();
        });
    </script>
</body>
</html>
